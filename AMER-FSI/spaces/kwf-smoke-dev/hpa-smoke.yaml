apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smoke
spec:
  maxReplicas: 5
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 90%
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps.tanzu.vmware.com/v1
    kind: ContainerApp
    name: smoke
